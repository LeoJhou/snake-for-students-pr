name: 測試

# Runs the unit tests on every pull request and on every push to main.
# A pull request whose tests fail cannot be merged — the rules stay enforced
# on GitHub, not only on the laptop that wrote the code.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
